<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26.06.16</title>
</head>
<body>
    <p>태조 이성계가 태어난 년도는?</p>
    <input type="text" id="answer">
    <button id="send-answer">제출</button>
</body>
</html>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    var count=1;
    $('button').on('click', function(e){
        if ($('#answer').val() != '1335') {
            e.preventDefault();
            if (count>2){
                alert('멍청아');
            } else {
                count+=1;
                alert('틀렸어');
            }
        }
        else{
            e.preventDefault();
            alert('정답 맞혔어');
        }
    })
</script>
