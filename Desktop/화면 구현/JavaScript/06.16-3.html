<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06.16-3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        .check-item {
            font-size: 14px;
        }

        .pass {
            color: green;
        }

        .fail {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container mt-5" style="max-width: 400px;">
        <h4 class="mb-4">🔐 회원가입</h4>

        <form>
            <div class="mb-3">
                <label for="email" class="form-label">이메일</label>
                <input type="text" class="form-control" id="email" placeholder="이메일을 입력하세요">
            </div>

            <div class="mb-1">
                <label for="pw" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="pw" placeholder="비밀번호를 입력하세요">
            </div>

            <ul class="list-unstyled mt-2 mb-3">
                <li class="check-item" id="check-upper"><span id="1">❌</span> 대문자 1개 이상</li>
                <li class="check-item" id="check-lower"><span id="2">❌</span> 소문자 1개 이상</li>
                <li class="check-item" id="check-number"><span id="3">❌</span> 숫자 1개 이상</li>
                <li class="check-item" id="check-special"><span id="4">❌</span> 특수문자 1개 이상 (!@#$%^&*)</li>
                <li class="check-item" id="check-length"><span id="5">❌</span> 8자리 이상</li>
            </ul>

            <div class="mb-3">
                <label for="pw2" class="form-label">비밀번호 확인</label>
                <input type="password" class="form-control" id="pw2" placeholder="비밀번호를 다시 입력하세요">
                <div id="pw-match-msg" class="form-text"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100">제출</button>
        </form>
    </div>

    <script>
        $('form').on('submit', function (e) {

            var 이메일 = document.getElementById('email').value;
            if (!/\S+@\S+\.\S+/.test(이메일)) {
                alert('이메일 형식아님')
                e.preventDefault();
                return;
            }
            var  비밀번호 = document.getElementById('pw').value;
            if (비밀번호 == '') {
                alert('비밀번호를 입력해주세요')
                e.preventDefault();
                return;
            }
            var  비밀번호확인 = document.getElementById('pw2').value;
            if (비밀번호확인 == '') {
                alert('비밀번호를 확인해주세요')
                e.preventDefault();
                return;
            }
        });

        document.getElementById('pw').addEventListener('input', function () {
            var 비밀번호 = document.getElementById('pw').value;
            var 비밀번호확인 = document.getElementById('pw2').value;
            if (/[A-Z]/.test(비밀번호)) {
                $('#1').html('✅');
                $('#check-upper').addClass('pass').removeClass('fail');
            }
            else {
                $('#1').html('❌');
                $('#check-upper').addClass('fail').removeClass('pass');
                preventDefault();
                alert('대문자 없음');
            }
            if (/[a-z]/.test(비밀번호)) {
                $('#2').html('✅');
                $('#check-lower').addClass('pass').removeClass('fail');
            }
            else {
                $('#2').html('❌');
                $('#check-lower').addClass('fail').removeClass('pass');
                preventDefault();
                alert('소문자 없음');
            }
            if (/[0-9]/.test(비밀번호)) {
                $('#3').html('✅');
                $('#check-number').addClass('pass').removeClass('fail');
            }
            else {
                $('#3').html('❌');
                $('#check-number').addClass('fail').removeClass('pass');
                preventDefault();
                alert('숫자 없음');
            }
            if (/[!@#$%^&*]/.test(비밀번호)) {
                $('#4').html('✅');
                $('#check-special').addClass('pass').removeClass('fail');
            }
            else {
                $('#4').html('❌');
                $('#check-special').addClass('fail').removeClass('pass');
                preventDefault();
                alert('특수문자 없음');
            }
            if (비밀번호.length >= 8) {
                $('#5').html('✅');
                $('#check-length').addClass('pass').removeClass('fail');
            }
            else {
                $('#5').html('❌');
                $('#check-length').addClass('fail').removeClass('pass');
                preventDefault();
                alert('특수문자 없음');
            }
            if (비밀번호 != 비밀번호확인) {
                e.preventDefault();
                alert('비밀번호가 일치하지 않습니다')
            }
        });

    </script>
